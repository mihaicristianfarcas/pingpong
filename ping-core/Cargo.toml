[package]
name = "ping-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Ping: the pingpong streaming client core (session, decode, render, input)"

[dependencies]
pingpong-proto = { path = "../pingpong-proto" }
pingpong-transport = { path = "../pingpong-transport" }
pingpong-pairing = { path = "../pingpong-pairing" }
if-addrs = "0.15"
pingpong-nat = { path = "../pingpong-nat" }
pingpong-audio = { path = "../pingpong-audio" }
pingpong-clipboard = { path = "../pingpong-clipboard" }
crossbeam-channel = "0.5"
parking_lot = "0.12"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(target_os = "macos")'.dependencies]
pingpong-decode = { path = "../pingpong-decode" }
libc = "0.2"
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["std", "NSString", "NSError", "NSRunLoop", "NSObjCRuntime", "NSGeometry", "NSThread", "NSDate", "NSArray", "NSNotification", "NSValue", "NSProcessInfo", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["std", "NSView", "NSResponder", "NSWindow", "NSApplication", "NSEvent", "NSScreen", "NSGraphics", "NSCursor", "NSImage", "NSRunningApplication", "NSMenu", "NSGraphicsContext", "NSColor", "NSPasteboard", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", features = ["std", "CALayer", "CAMetalLayer", "CAMetalDisplayLink", "CAFrameRateRange", "CABase", "objc2-metal", "objc2-core-foundation"] }
objc2-game-controller = { version = "0.3", features = ["std", "GCController", "GCDevice", "GCDeviceHaptics", "GCExtendedGamepad", "GCControllerButtonInput", "GCControllerAxisInput", "GCControllerDirectionPad", "GCControllerElement", "GCPhysicalInputProfile", "objc2-core-haptics"] }
objc2-core-haptics = { version = "0.3", features = ["std", "CHHapticEngine", "CHHapticEvent", "CHHapticParameter", "CHHapticPattern", "CHHapticPatternPlayer"] }
objc2-metal = { version = "0.3", features = ["std", "block2", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLLibrary", "MTLTexture", "MTLPixelFormat", "MTLDrawable", "MTLResource", "MTLTypes", "MTLSampler"] }
objc2-core-foundation = { version = "0.3", features = ["std", "CFBase", "CFDictionary", "CFString", "CFAttributedString", "CFCGTypes", "CFNumber"] }
objc2-core-video = { version = "0.3", features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "CVMetalTexture", "CVMetalTextureCache", "CVDisplayLink", "objc2", "objc2-metal", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["std", "CGContext", "CGBitmapContext", "CGColorSpace", "CGImage", "CGDisplayConfiguration", "CGRemoteOperation", "CGEventTypes", "CGDirectDisplay", "CGGeometry", "CGColor"] }
objc2-core-text = { version = "0.3", features = ["std", "CTLine", "CTFont", "CTStringAttributes", "objc2-core-graphics"] }

[target.'cfg(windows)'.dependencies]
pingpong-decode = { path = "../pingpong-decode" }
png = "0.18"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
pingpong-decode = { path = "../pingpong-decode" }
ab_glyph = "0.2"
arboard = "3"
epaint_default_fonts = "0.36"
gilrs = "0.11"
png = "0.18"
pollster = "1"
wgpu = "30"
winit = "0.30"

[[bin]]
name = "ping"
path = "src/bin/ping/main.rs"
