[package]
name = "pong"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Pong: the pingpong streaming host (Windows, macOS, Linux)"

[dependencies]
pingpong-proto = { path = "../pingpong-proto" }
pingpong-transport = { path = "../pingpong-transport" }
pingpong-display = { path = "../pingpong-display" }
pingpong-input = { path = "../pingpong-input" }
pingpong-pairing = { path = "../pingpong-pairing" }
pingpong-nat = { path = "../pingpong-nat" }
crossbeam-channel = "0.5"
pingpong-clipboard = { path = "../pingpong-clipboard" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
# Web UI
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.14"
argon2 = "0.5"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6"
ctrlc = { version = "3", features = ["termination"] }
pingpong-audio = { path = "../pingpong-audio" }
objc2-core-foundation = { version = "0.3", features = ["std", "CFBase", "CFString", "CFDictionary", "CFNumber"] }
pingpong-capture = { path = "../pingpong-capture" }
pingpong-encode = { path = "../pingpong-encode" }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "inhibit", "remote_desktop", "screencast"] }
ctrlc = { version = "3", features = ["termination"] }
enumflags2 = "0.7"
pingpong-audio = { path = "../pingpong-audio" }
pingpong-capture = { path = "../pingpong-capture" }
pingpong-encode = { path = "../pingpong-encode" }
x11rb = { version = "0.13", features = ["dpms", "screensaver"] }

[target.'cfg(windows)'.dependencies]
pingpong-audio = { path = "../pingpong-audio" }
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
pingpong-capture = { path = "../pingpong-capture" }
pingpong-encode = { path = "../pingpong-encode" }
windows-service = "0.8"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_Media",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
