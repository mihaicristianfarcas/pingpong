[package]
name = "pingpong-proto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "The pingpong wire protocol: headers, FEC, reassembly, control, input, audio and clipboard messages, Annex-B video (no I/O)"

[dependencies]
reed-solomon-simd = "3"
# SIMD start-code search over every frame (annexb.rs).
memchr = "2"
# Permissions read and written as names (`permission`); no I/O.
serde = "1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
serde_json = "1"

[[bench]]
name = "datapath"
harness = false
