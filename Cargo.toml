[workspace]
resolver = "2"
members = [
    "pingpong-audio",
    "pingpong-capture",
    "pingpong-clipboard",
    "pingpong-decode",
    "pingpong-display",
    "pingpong-encode",
    "pingpong-input",
    "pingpong-nat",
    "pingpong-pairing",
    "pingpong-proto",
    "pong",
    "ping-core",
    "ping-agent",
    "ping-app",
    "pingpong-transport",
    "pingpong-ui",
    "pingpong-update",
    "pong-app",
]
# spikes/* are deliberately NOT members -- a throwaway probe must never gate a
# workspace-wide `cargo test`. Each spike also carries its own empty
# `[workspace]` table so it resolves standalone.
exclude = ["spikes", "tools/rawinput-probe"]

[workspace.package]
# The project's version: every program built from the workspace has it
# (Ping, Pong, their windows and command lines), so one release tag names
# them all and the update check has one number to compare. The libraries
# keep versions of their own.
version = "0.7.0"
edition = "2021"
rust-version = "1.96"
repository = "https://github.com/mihaicristianfarcas/pingpong"
license = "GPL-3.0-only"
# Applications and their private libraries, not crates for crates.io.
publish = false

# GPUI (Zed's UI framework) draws Ping's and Pong's windows, pinned to one Zed
# revision: zed#62743 or later, whose line wrapping keeps closing punctuation
# with its word (before it, a paragraph could end on a line holding only
# ")."). Its Metal shaders are compiled ahead by Xcode's Metal toolchain, or when the
# app starts with the apps' `runtime-shaders` feature (the default, so a build
# needs only the Command Line Tools; the app bundles use Xcode when it is there).
[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "4278ff36ef76916c719dfdd1557efd4401206985" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "4278ff36ef76916c719dfdd1557efd4401206985", features = ["font-kit", "wayland", "x11"] }

[patch."https://github.com/zed-industries/zed.git"]
# GPUI's sum_tree names Zed's GPL-licensed profiling shim though profiling is
# off; vendor/ holds the same no-op API under Apache-2.0.
ztracing = { path = "vendor/ztracing" }
ztracing_macro = { path = "vendor/ztracing_macro" }

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
