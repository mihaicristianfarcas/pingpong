# str0m 0.24.1 (github.com/algesten/str0m, MIT OR Apache-2.0; LICENSE-MIT
# here, LICENSE-APACHE in vendor/), with two changes, each marked
# "pingpong:" in the code:
# - The NACK register follows 1,000 packets instead of 100
#   (src/streams/register_nack.rs `MAX_MISORDER`). At 100, a packet more
#   than 100 behind the newest is neither asked for again nor, in RTP
#   mode, handed over when it comes: a console's video at 2,000-3,000
#   packets a second over a link with a 50 ms round trip has its
#   retransmissions arrive after that, and they were dropped. Chrome
#   follows 1,000 (`kMaxNackPackets`).
# - A packet found missing is NACKed at once, not at the next 33 ms NACK
#   interval (16 ms later on average); each packet's retries stay 33 ms
#   apart (`NACK_RETRY`; session.rs, streams/). A fifth less time without
#   a new frame at 1% loss (docs/benchmarks.md, "Xbox: a lossy link").
# Only the library is here: str0m's tests, examples and fuzz targets are
# not.
[package]
edition = "2024"
rust-version = "1.85.0"
name = "str0m"
version = "0.24.1"
authors = [
    "Martin Algesten <martin@algesten.se>",
    "Hugo Tunius <h@tunius.se>",
    "Davide Bertola <dade@dadeb.it>",
]
build = false
exclude = [
    "/cargo_deny.sh",
    "/deny.toml",
    "/run-fuzz.sh",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "WebRTC library in Sans-IO style"
readme = "README.md"
keywords = [
    "webrtc",
    "streaming",
    "video",
    "audio",
    "media",
]
categories = [
    "web-programming",
    "multimedia",
    "network-programming",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/algesten/str0m"
publish = false

[features]
_internal_dont_use_log_stats = []
_internal_test_exports = [
    "str0m-proto/_internal_test_exports",
    "is/_internal_test_exports",
]
apple-crypto = ["dep:str0m-apple-crypto"]
aws-lc-rs = ["dep:str0m-aws-lc-rs"]
default = ["aws-lc-rs"]
drv = ["dep:drv"]
openssl = ["dep:str0m-openssl"]
openssl-dimpl = [
    "dep:str0m-openssl",
    "str0m-openssl/dimpl",
]
pii = [
    "str0m-proto/pii",
    "is/pii",
]
rust-crypto = ["dep:str0m-rust-crypto"]
unversioned = []
vendored = ["str0m-openssl?/vendored"]
wincrypto = ["dep:str0m-wincrypto"]
wincrypto-dimpl = ["wincrypto"]

[lib]
name = "str0m"
path = "src/lib.rs"

[dependencies.arrayvec]
version = "0.7.6"

[dependencies.base64ct]
version = "1"

[dependencies.combine]
version = "4.6.6"

[dependencies.dimpl]
version = "0.7.4"
default-features = false

[dependencies.drv]
version = "0.4.3"
optional = true

[dependencies.fastrand]
version = "2.0.1"

[dependencies.is]
version = "0.11.1"
default-features = false

[dependencies.sctp-proto]
version = "0.10.5"

[dependencies.serde]
version = "1.0.152"
features = ["derive"]

[dependencies.str0m-aws-lc-rs]
version = "0.6.0"
optional = true

[dependencies.str0m-openssl]
version = "0.6.0"
optional = true

[dependencies.str0m-proto]
version = "0.7.0"
features = ["dtls"]
default-features = false

[dependencies.str0m-rust-crypto]
version = "0.6.0"
optional = true

[dependencies.subtle]
version = "2.0.0"

[dependencies.time]
version = "0.3"

[dependencies.tracing]
version = "0.1.37"

[target.'cfg(target_vendor = "apple")'.dependencies.str0m-apple-crypto]
version = "0.6.0"
optional = true

[target."cfg(windows)".dependencies.str0m-wincrypto]
version = "0.8.1"
optional = true
