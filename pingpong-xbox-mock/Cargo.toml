[package]
name = "pingpong-xbox-mock"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "A mock Xbox and Microsoft's services, for testing Ping's Xbox streaming without a console or an account"

[[bin]]
name = "xbox-mock"
path = "src/main.rs"

[dependencies]
pingpong-audio = { path = "../pingpong-audio" }
pingpong-xbox = { path = "../pingpong-xbox" }
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde_json = "1"
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
pingpong-proto = { path = "../pingpong-proto" }
tempfile = "3"

# The mock's stream, decoded by the decoders the client uses.
[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dev-dependencies]
pingpong-decode = { path = "../pingpong-decode" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-video = { version = "0.3", features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
