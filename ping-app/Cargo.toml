[package]
name = "ping-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Ping: the pingpong streaming client app (host list, pairing, settings) for macOS, Windows and Linux"

[[bin]]
name = "ping-app"
path = "src/main.rs"

[features]
default = ["runtime-shaders"]
# See pingpong-ui; the app bundles build without it when Xcode is there.
runtime-shaders = ["pingpong-ui/runtime-shaders"]

[dependencies]
ping-core = { path = "../ping-core" }
ping-agent = { path = "../ping-agent" }
serde_json = "1"
pingpong-pairing = { path = "../pingpong-pairing" }
pingpong-proto = { path = "../pingpong-proto" }
crossbeam-channel = "0.5"
futures = "0.3"
gpui.workspace = true
gpui_platform.workspace = true
pingpong-ui = { path = "../pingpong-ui", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["std", "NSString", "NSArray", "NSSet", "NSError", "NSBundle"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger"] }
objc2-core-foundation = { version = "0.3", features = ["std", "CFBase", "CFString", "CFNumber", "CFPreferences", "CFPropertyList"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tiny-skia = "0.12"

[build-dependencies]
winresource = "0.1"
