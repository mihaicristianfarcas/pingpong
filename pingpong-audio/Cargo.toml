[package]
name = "pingpong-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "pingpong audio: Opus, WASAPI loopback and Core Audio tap capture (host), playback (client)"

[dependencies]
pingpong-proto = { path = "../pingpong-proto" }
unsafe-libopus = "0.2"
rtrb = "0.3"
crossbeam-channel = "0.5"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["std", "NSArray", "NSDictionary", "NSString", "NSValue", "NSUUID", "NSObject"] }
objc2-core-foundation = { version = "0.3", features = ["std", "CFBase", "CFString", "CFDictionary"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.18"

[dev-dependencies]
tracing-subscriber = "0.3"
