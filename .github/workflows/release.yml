# A release, from every push to main that changes the programs: Ping and Pong
# built on macOS (Apple silicon and Intel), Windows and Linux, and published
# as the website's downloads (tools/publish-downloads: Cloudflare R2, served
# at downloads.ping-pong.sh; the website is on the landing-page branch). When the workspace's version (Cargo.toml's
# [workspace.package]) has no tag yet, the same archives become the GitHub
# release vVERSION too, and a pull request brings the Homebrew casks
# (Casks/) to it (main takes changes only through pull requests). So
# releasing a version is merging the change that sets it.
#
# workflow_dispatch: to run it by hand. On main it publishes as a push does;
# on another branch it only builds, and the archives are the run's
# artifacts.
#
# The downloads need two settings in the repository: the secret
# CLOUDFLARE_API_TOKEN (an API token with Workers R2 Storage: Edit) and the
# variable CLOUDFLARE_ACCOUNT_ID.
name: Release

on:
  push:
    branches: [main]
    # What does not change the programs does not make new ones.
    paths-ignore:
      - "Casks/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# One release at a time, in the order of the pushes; of those waiting, only
# the newest runs.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # To approve the casks pull request's CI run (see below).
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build and package
        run: tools/package-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: target/dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # As in ci.yml: FFmpeg's current shared build (its DLLs go beside
      # Ping.exe), and LLVM's libclang (on the runner already).
      - name: FFmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = gh release view latest --repo BtbN/FFmpeg-Builds --json assets --jq '.assets[].name' |
            Where-Object { $_ -match '^ffmpeg-n[0-9.]+-latest-win64-lgpl-shared-[0-9.]+\.zip$' } |
            Sort-Object -Descending | Select-Object -First 1
          if (-not $asset) { throw 'no FFmpeg build found' }
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern $asset --dir $env:RUNNER_TEMP
          Expand-Archive (Join-Path $env:RUNNER_TEMP $asset) -DestinationPath $env:RUNNER_TEMP
          $dir = Join-Path $env:RUNNER_TEMP ($asset -replace '\.zip$', '')
          "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build and package
        shell: pwsh
        run: ./tools/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: target/dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # tools/linux/Dockerfile's build packages, as in ci.yml.
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config clang libclang-dev \
            libavcodec-dev libavutil-dev libswscale-dev libva-dev \
            libasound2-dev libpulse-dev libudev-dev \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig-dev libfreetype-dev libxcb1-dev \
            libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build and package
        run: tools/linux/package
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: target/dist/*.tar.gz
          if-no-files-found: error

  downloads:
    name: Website downloads
    needs: [macos, windows, linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: tools/publish-downloads dist

  release:
    name: GitHub release
    needs: [macos, windows, linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Is the version new
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is released already: no GitHub release"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new
        with:
          path: dist
          merge-multiple: true
      - name: The release, with the apps
        if: steps.version.outputs.new
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "pingpong $VERSION" --generate-notes
      - name: The casks, at the new version, as a pull request
        if: steps.version.outputs.new
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="casks-$VERSION"
          tools/update-casks "$VERSION" dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Casks
          git commit -m "Casks: Ping and Pong $VERSION" \
            -m "The release's archives and their checksums, from the release workflow."
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Casks: Ping and Pong $VERSION" \
            --body "The Homebrew casks at release v$VERSION: its archives and their checksums. Merging this is what makes \`brew upgrade\` see the release."
          # GitHub holds the CI run of a pull request a workflow opened until
          # someone approves it, and main merges only on that run's checks
          # (a run started by hand on the branch does not count). Approve it
          # here; if this token may not, the pull request says so and it is
          # approved by hand (Actions, or
          # gh api -X POST repos/OWNER/REPO/actions/runs/ID/approve).
          for _ in $(seq 1 20); do
            run=$(gh run list --branch "$branch" --event pull_request --json databaseId,conclusion \
              --jq '.[] | select(.conclusion == "action_required") | .databaseId' | head -n 1)
            [ -n "$run" ] && break
            sleep 6
          done
          if [ -n "$run" ] && gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve"; then
            echo "approved CI run $run"
          else
            gh pr comment "$branch" --body "CI on this pull request waits for approval: approve its run in the Actions tab, then merge once it passes."
          fi
