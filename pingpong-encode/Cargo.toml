[package]
name = "pingpong-encode"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Video encoding for the pingpong host: NVENC or Media Foundation (Windows), VideoToolbox (macOS), FFmpeg (Linux)"

[dependencies]
pingpong-proto = { path = "../pingpong-proto" }
tracing = "0.1"

# NVENC is loaded from the driver's nvEncodeAPI64.dll at runtime (see
# src/nvenc.rs), so building the host needs no CUDA toolkit, no Video Codec SDK
# and no import library -- only the vendored type bindings in src/nvenc_sys.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[target.'cfg(windows)'.dev-dependencies]
pingpong-capture = { path = "../pingpong-capture" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", features = ["std", "CFBase", "CFData", "CFNumber", "CFString", "CFDictionary"] }
objc2-core-media = { version = "0.3", features = ["std", "CMBase", "CMTime", "CMBlockBuffer", "CMSampleBuffer", "CMFormatDescription", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-video-toolbox = { version = "0.3", features = ["std", "VTBase", "VTErrors", "VTSession", "VTCompressionSession", "VTCompressionProperties"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
pingpong-capture = { path = "../pingpong-capture" }

# Linux: FFmpeg's encoders (VA-API, NVENC, x264) and swscale, from the system
# (pkg-config; libclang for the bindings).
[target.'cfg(target_os = "linux")'.dependencies]
ffmpeg-sys-next = { version = "8.0", default-features = false, features = ["avcodec", "swscale"] }
