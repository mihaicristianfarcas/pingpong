[package]
name = "ping-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Computer use over pingpong: a headless session for AI agents, an MCP server, and agent runners (Claude Code, Codex, API keys)"

[dependencies]
ping-core = { path = "../ping-core" }
pingpong-proto = { path = "../pingpong-proto" }
pingpong-transport = { path = "../pingpong-transport" }
pingpong-decode = { path = "../pingpong-decode" }
base64 = "0.22"
getrandom = "0.3"
crossbeam-channel = "0.5"
ctrlc = { version = "3", features = ["termination"] }
parking_lot = "0.12"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-video = { version = "0.3", features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ping-agent"
path = "src/bin/ping-agent.rs"
