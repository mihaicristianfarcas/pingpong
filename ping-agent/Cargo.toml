[package]
name = "ping-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Computer use over pingpong: a headless session for AI agents, an MCP server, and agent runners (Claude Code, Codex, API keys)"

[dependencies]
ping-core = { path = "../ping-core" }
pingpong-proto = { path = "../pingpong-proto" }
pingpong-transport = { path = "../pingpong-transport" }
pingpong-decode = { path = "../pingpong-decode" }
base64 = "0.22"
getrandom = "0.3"
crossbeam-channel = "0.5"
ctrlc = { version = "3", features = ["termination"] }
parking_lot = "0.12"
png = "0.18"
# JPEG for clef's pictures (judge.rs). Already in the tree (arboard, GPUI),
# so this adds no crate.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: settings files of other agents are rewritten with their keys
# in the order they had (src/install.rs).
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-video = { version = "0.3", features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ping-agent"
path = "src/bin/ping-agent.rs"
