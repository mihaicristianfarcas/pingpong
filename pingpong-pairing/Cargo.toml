[package]
name = "pingpong-pairing"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "PIN pairing (SPAKE2) and LAN discovery (mDNS) for Ping and Pong"

[dependencies]
pingpong-transport = { path = "../pingpong-transport" }
spake2 = "0.4"
# The ephemeral ML-KEM-768 exchange that makes pairing hybrid (as the tunnel
# is): the same crate pq-boringtun uses, keys from the system's randomness.
ml-kem = { version = "0.3.2", features = ["getrandom"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.21"
tracing = "0.1"
