<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="ping-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f38"/>
      <stop offset="1" stop-color="#0a0d1a"/>
    </linearGradient>
    <linearGradient id="ping-trail" gradientUnits="userSpaceOnUse" x1="210" y1="724" x2="640" y2="414">
      <stop offset="0" stop-color="#4d88ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4d88ff" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="ping-shine" gradientUnits="userSpaceOnUse" cx="656" cy="368" r="80">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ping-glow" x="-150%" y="-150%" width="400%" height="400%">
