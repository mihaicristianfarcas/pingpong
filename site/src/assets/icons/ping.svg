  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ping-body)"/>
  <g clip-path="url(#ping-clip)">
    <path d="M512 150V874" stroke="#fff" stroke-opacity=".1" stroke-width="10" stroke-dasharray="34 26"/>
    <path d="M210 724Q380 324 640 414" fill="none" stroke="url(#ping-trail)" stroke-width="44" stroke-linecap="round"/>
    <circle cx="690" cy="404" r="92" fill="#3d7bff" fill-opacity=".9" filter="url(#ping-glow)"/>
    <circle cx="690" cy="404" r="92" fill="#4d88ff"/>
    <circle cx="690" cy="404" r="92" fill="url(#ping-shine)"/>
  </g>
</svg>
