[package]
name = "pingpong-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "The look Ping and Pong share: GPUI tokens, icons and controls"

[features]
default = ["runtime-shaders"]
# Compile GPUI's Metal shaders when the app starts, not at build time (which
# needs Xcode's Metal toolchain).
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
futures = "0.3"
gpui.workspace = true
gpui_platform.workspace = true
pingpong-update = { path = "../pingpong-update" }
raw-window-handle = "0.6"
tracing = "0.1"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["std", "NSString", "NSData", "NSGeometry", "NSDictionary", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSEvent", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSImageRep", "NSBitmapImageRep"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
