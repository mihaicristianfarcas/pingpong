[package]
name = "pingpong-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "The look Ping and Pong share: GPUI tokens, icons and controls"

[features]
default = ["runtime-shaders"]
# Compile GPUI's Metal shaders when the app starts, not at build time (which
# needs Xcode's Metal toolchain).
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
raw-window-handle = "0.6"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
