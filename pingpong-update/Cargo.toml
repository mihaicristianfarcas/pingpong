[package]
name = "pingpong-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Knowing when a newer Ping or Pong exists: GitHub's releases, and the main branch for builds from a checkout"
build = "build.rs"

[dependencies]
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
