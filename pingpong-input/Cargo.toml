[package]
name = "pingpong-input"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Input injection on the pingpong host: SendInput (Windows), CoreGraphics events (macOS), XTest (Linux)"

[dependencies]
# The trait and the held-set bookkeeping are platform-free, so the host's
# session rules stay testable on any machine -- the same split as
# pingpong-display.
pingpong-proto = { path = "../pingpong-proto" }
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    # Only for XBUTTON1/XBUTTON2, which 0.61 keeps here rather than beside the
    # MOUSEEVENTF_* flags they pair with.
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_StationsAndDesktops",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["std", "NSData", "NSGeometry"] }
objc2-core-foundation = { version = "0.3", features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["std", "CGDirectDisplay", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
# The user's key repeat and double-click settings (`NSEvent`'s class methods).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-graphics = { version = "0.3", features = ["std", "CGDirectDisplay", "CGEvent", "CGEventTypes"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
